<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>LCHS Student Athletic Pass</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

.subtitle {
  color: #f4c430;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

#statusBar {
  background: #222222;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  font-weight: bold;
}

.ready {
  color: #f4c430;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  margin-top: 15px;
  padding: 20px;
  border-radius: 15px;
  min-height: 100px;
}

.success {
  background: #164d22;
}

.bad {
  background: #632020;
}

.warn {
  background: #66510d;
}

.name {
  font-size: 30px;
  font-weight: bold;
}

.big {
  font-size: 21px;
  margin: 8px;
}

.small {
  margin-top: 10px;
  font-size: 15px;
}

button {
  background: #f4c430;
  color: #111111;
  border: none;
  padding: 16px 30px;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

</style>

</head>


<body>

<div class="container">

<h1>
LEWIS COUNTY HIGH SCHOOL
</h1>

<div class="subtitle">
STUDENT ATHLETIC PASS
</div>


<div id="statusBar">
<span class="ready">READY TO SCAN</span>
</div>


<button
id="startButton"
onclick="startScanner()">

START SCANNER

</button>


<div id="reader"></div>

<div id="result"></div>

</div>


<script>


/*
====================================================
APPS SCRIPT URL
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxX4O8t7AmQhFzMNfxEG7n5YZnBEesD24-bka1PlqDTkVN2dCKJ-wuntxdObCpS4eLu/exec";


/*
====================================================
GLOBAL VARIABLES
====================================================
*/

let scanner = null;

let scanning = false;

let processing = false;


/*
====================================================
START SCANNER
====================================================
*/

function startScanner() {

  if (processing) {
    return;
  }


  const button =
    document.getElementById("startButton");


  button.style.display = "none";


  setStatus(
    "READY TO SCAN",
    "ready"
  );


  document.getElementById("result")
    .className = "";


  document.getElementById("result")
    .innerHTML = "";


  document.getElementById("reader")
    .innerHTML = "";


  scanner =
    new Html5Qrcode("reader");


  scanning = true;


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 12,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (
        !scanning ||
        processing
      ) {
        return;
      }


      scanning = false;

      processing = true;


      setStatus(
        "PROCESSING...",
        ""
      );


      scanner.stop()

        .then(function() {

          processStudent(decodedText);

        })

        .catch(function() {

          processStudent(decodedText);

        });

    },

    function(errorMessage) {

      // Ignore normal scan errors.

    }

  )

  .catch(function(error) {

    scanning = false;

    processing = false;


    showError(
      "CAMERA ERROR",
      error.message
    );


    button.style.display =
      "inline-block";


    setStatus(
      "SCANNER STOPPED",
      ""
    );

  });

}


/*
====================================================
PROCESS STUDENT
====================================================
*/

function processStudent(studentId) {

  showMessage(
    "CHECKING STUDENT..."
  );


  const callbackName =
    "lchsCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showResult(result);

    };


  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=scan" +

    "&studentId=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +

    "&scanner=" +
    encodeURIComponent(
      "Main Gate"
    ) +

    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showError(
        "SYSTEM ERROR",
        "Could not contact attendance system."
      );


      scheduleRestart();

    };


  document.body.appendChild(script);

}


/*
====================================================
SHOW RESULT
====================================================
*/

function showResult(r) {


  /*
   * SUCCESS
   */

  if (r.ok) {

    const result =
      document.getElementById("result");


    result.className =
      "success";


    result.innerHTML =

      '<div class="name">' +

      '✓ ' +

      escapeHtml(
        r.student
      ) +

      '</div>' +


      '<div class="big">' +

      'GRADE ' +

      escapeHtml(
        r.grade
      ) +

      '</div>' +


      '<div class="big">' +

      'ATTENDANCE RECORDED' +

      '</div>' +


      '<div>' +

      escapeHtml(
        r.event
      ) +

      '</div>' +


      '<div class="small">' +

      'Total Events Attended: <b>' +

      escapeHtml(
        r.total
      ) +

      '</b>' +

      '</div>';


    setStatus(
      "SUCCESS",
      ""
    );

  }


  /*
   * DUPLICATE
   */

  else if (
    r.type === "DUPLICATE"
  ) {

    const result =
      document.getElementById("result");


    result.className =
      "warn";


    result.innerHTML =

      '<div class="name">' +

      '⚠ ALREADY CHECKED IN' +

      '</div>' +


      '<div class="big">' +

      escapeHtml(
        r.student
      ) +

      '</div>' +


      '<div>' +

      escapeHtml(
        r.event || ""
      ) +

      '</div>';


    setStatus(
      "DUPLICATE",
      ""
    );

  }


  /*
   * OTHER ERROR
   */

  else {

    showError(

      "✕ " +
      (
        r.message ||
        "UNKNOWN ERROR"
      ),

      ""

    );


    setStatus(
      "SCAN FAILED",
      ""
    );

  }


  scheduleRestart();

}


/*
====================================================
AUTOMATIC RESTART
====================================================
*/

function scheduleRestart() {

  setTimeout(
    function() {

      restartScanner();

    },

    2000
  );

}


function restartScanner() {

  scanning = false;

  processing = false;


  document.getElementById("result")
    .className = "";


  document.getElementById("result")
    .innerHTML = "";


  document.getElementById("reader")
    .innerHTML = "";


  scanner = null;


  setStatus(
    "READY TO SCAN",
    "ready"
  );


  setTimeout(
    function() {

      startScanner();

    },

    250
  );

}


/*
====================================================
DISPLAY HELPERS
====================================================
*/

function showMessage(message) {

  const result =
    document.getElementById("result");


  result.className = "";


  result.innerHTML =

    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


function showError(
  title,
  message
) {

  const result =
    document.getElementById("result");


  result.className =
    "bad";


  result.innerHTML =

    '<div class="name">' +

    escapeHtml(
      title
    ) +

    '</div>' +


    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


function setStatus(
  text,
  cssClass
) {

  const status =
    document.getElementById(
      "statusBar"
    );


  status.innerHTML =

    '<span class="' +

    cssClass +

    '">' +

    escapeHtml(
      text
    ) +

    '</span>';

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(text) {

  return String(text)

    .replace(
      /[&<>"']/g,

      function(m) {

        return {

          '&': '&amp;',

          '<': '&lt;',

          '>': '&gt;',

          '"': '&quot;',

          "'": '&#039;'

        }[m];

      }

    );

}

</script>

</body>

</html>
