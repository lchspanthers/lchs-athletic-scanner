<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>LCHS Student Athletic Pass</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

body {
  margin: 0;
  background: #111111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

.subtitle {
  color: #f4c430;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  min-height: 80px;
}

.success {
  background: #164d22;
}

.bad {
  background: #632020;
}

.warn {
  background: #66510d;
}

.name {
  font-size: 28px;
  font-weight: bold;
}

.big {
  font-size: 20px;
  margin: 8px;
}

button {
  background: #f4c430;
  color: #111111;
  border: none;
  padding: 16px 30px;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
}

</style>

</head>


<body>

<div class="container">

<h1>
LEWIS COUNTY HIGH SCHOOL
</h1>

<div class="subtitle">
STUDENT ATHLETIC PASS
</div>


<button
id="startButton"
onclick="startScanner()">

START SCANNER

</button>


<div id="reader"></div>


<div id="result"></div>

</div>


<script>


/*
====================================================
YOUR CORRECT APPS SCRIPT WEB APP URL
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwhggRv4YRLVlFgCrklPIK7g4tcG7YqevJjbs--P90hJsjfE8J2VehL5WDVochfbHqrsQ/exec";


let scanner = null;

let scanning = false;


/*
====================================================
START CAMERA
====================================================
*/

function startScanner() {

  document.getElementById("startButton")
    .style.display = "none";


  scanner =
    new Html5Qrcode("reader");


  scanning = true;


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (!scanning) {
        return;
      }


      scanning = false;


      scanner.stop()

        .then(function() {

          processStudent(decodedText);

        })

        .catch(function() {

          processStudent(decodedText);

        });

    },

    function(errorMessage) {

      // Ignore normal scanning messages.

    }

  )

  .catch(function(error) {

    showError(
      "CAMERA ERROR",
      error.message
    );


    document.getElementById("startButton")
      .style.display = "inline-block";

  });

}


/*
====================================================
SEND QR CODE TO GOOGLE APPS SCRIPT
====================================================
*/

function processStudent(studentId) {

  showMessage(
    "CHECKING STUDENT..."
  );


  /*
   * Create unique callback.
   */

  const callbackName =
    "lchsCallback_" +
    Date.now();


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showResult(result);

    };


  /*
   * Create script request.
   */

  const script =
    document.createElement("script");


  /*
   * Send Student ID to Apps Script.
   */

  script.src =

    API_URL +

    "?action=scan" +

    "&studentId=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +

    "&scanner=" +
    encodeURIComponent(
      "Main Gate"
    ) +

    "&callback=" +
    callbackName;


  /*
   * Handle connection failure.
   */

  script.onerror =
    function() {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showError(

        "SYSTEM ERROR",

        "Could not contact attendance system."

      );

    };


  /*
   * Send request.
   */

  document.body.appendChild(script);

}


/*
====================================================
SHOW RESULT
====================================================
*/

function showResult(r) {


  /*
   * SUCCESS
   */

  if (r.ok) {

    const result =
      document.getElementById("result");


    result.className =
      "success";


    result.innerHTML =

      '<div class="name">' +

      '✓ ' +

      escapeHtml(
        r.student
      ) +

      '</div>' +


      '<div class="big">' +

      'GRADE ' +

      escapeHtml(
        r.grade
      ) +

      '</div>' +


      '<div class="big">' +

      'ATTENDANCE RECORDED' +

      '</div>' +


      '<div>' +

      escapeHtml(
        r.event
      ) +

      '</div>' +


      '<div style="margin-top:10px">' +

      'Total Events: <b>' +

      escapeHtml(
        r.total
      ) +

      '</b>' +

      '</div>';

  }


  /*
   * DUPLICATE
   */

  else if (
    r.type === "DUPLICATE"
  ) {

    const result =
      document.getElementById("result");


    result.className =
      "warn";


    result.innerHTML =

      '<div class="name">' +

      '⚠ ALREADY CHECKED IN' +

      '</div>' +


      '<div class="big">' +

      escapeHtml(
        r.student
      ) +

      '</div>';

  }


  /*
   * OTHER ERROR
   */

  else {

    showError(

      "✕ " +
      (
        r.message ||
        "UNKNOWN ERROR"
      ),

      ""

    );

  }


  /*
   * Reset after 2.5 seconds.
   */

  setTimeout(
    resetScanner,
    2500
  );

}


/*
====================================================
SHOW MESSAGE
====================================================
*/

function showMessage(message) {

  const result =
    document.getElementById("result");


  result.className =
    "";


  result.innerHTML =

    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


/*
====================================================
SHOW ERROR
====================================================
*/

function showError(
  title,
  message
) {

  const result =
    document.getElementById("result");


  result.className =
    "bad";


  result.innerHTML =

    '<div class="name">' +

    escapeHtml(
      title
    ) +

    '</div>' +


    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


/*
====================================================
RESET
====================================================
*/

function resetScanner() {

  document.getElementById("result")
    .className = "";


  document.getElementById("result")
    .innerHTML = "";


  document.getElementById("reader")
    .innerHTML = "";


  document.getElementById("startButton")
    .style.display = "inline-block";


  scanner = null;

  scanning = false;

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(text) {

  return String(text)

    .replace(
      /[&<>"']/g,

      function(m) {

        return {

          '&': '&amp;',

          '<': '&lt;',

          '>': '&gt;',

          '"': '&quot;',

          "'": '&#039;'

        }[m];

      }

    );

}

</script>

</body>

</html>
