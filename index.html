<!DOCTYPE html>
<html>

<head>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>LCHS Student Athletic Pass</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

.subtitle {
  color: #f4c430;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
}

.card {
  background: #222222;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 10px;
  font-weight: bold;
  font-size: 18px;
}

select {
  width: 100%;
  padding: 15px;
  border-radius: 8px;
  font-size: 17px;
  margin-bottom: 15px;
}

button {
  background: #f4c430;
  color: #111111;
  border: none;
  padding: 15px 25px;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
  margin: 8px;
}

.secondary {
  background: #444444;
  color: white;
}

#selectedEvent {
  display: none;
  background: #222222;
  border: 2px solid #f4c430;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.eventName {
  font-size: 22px;
  font-weight: bold;
}

.eventDetails {
  margin-top: 6px;
  color: #cccccc;
}

#statusBar {
  background: #222222;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-weight: bold;
}

.ready {
  color: #f4c430;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  margin-top: 15px;
  padding: 20px;
  border-radius: 15px;
  min-height: 80px;
}

.success {
  background: #164d22;
}

.warn {
  background: #66510d;
}

.bad {
  background: #632020;
}

.name {
  font-size: 28px;
  font-weight: bold;
}

.big {
  font-size: 20px;
  margin: 8px;
}

.small {
  margin-top: 8px;
  font-size: 15px;
}

</style>

</head>


<body>

<div class="container">

<h1>
LEWIS COUNTY HIGH SCHOOL
</h1>

<div class="subtitle">
STUDENT ATHLETIC PASS
</div>


<!-- EVENT SELECTION -->

<div
  id="eventSelection"
  class="card"
>

<label for="eventSelect">
SELECT YOUR EVENT
</label>

<select id="eventSelect">

<option value="">
Loading events...
</option>

</select>

<button
  onclick="chooseEvent()"
>
SELECT EVENT
</button>

</div>


<!-- SELECTED EVENT -->

<div id="selectedEvent">

<div id="selectedEventName"
     class="eventName">
</div>

<div id="selectedEventDetails"
     class="eventDetails">
</div>

<button
  id="startButton"
  onclick="startScanner()"
>
START SCANNER
</button>

<button
  class="secondary"
  onclick="changeEvent()"
>
CHANGE EVENT
</button>

</div>


<!-- SCANNER -->

<div
  id="statusBar"
  style="display:none;"
>
<span class="ready">
READY TO SCAN
</span>
</div>


<div id="reader"></div>

<div id="result"></div>

</div>


<script>


/*
====================================================
GOOGLE APPS SCRIPT URL
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxX4O8t7AmQhFzMNfxEG7n5YZnBEesD24-bka1PlqDTkVN2dCKJ-wuntxdObCpS4eLu/exec";


/*
====================================================
GLOBALS
====================================================
*/

let events = [];

let selectedEvent = null;

let scanner = null;

let scannerStarted = false;

let processing = false;

let lastCode = "";

let lastCodeTime = 0;


/*
====================================================
LOAD EVENTS WHEN PAGE OPENS
====================================================
*/

window.onload =
function() {

  loadEvents();

};


/*
====================================================
LOAD ACTIVE EVENTS
====================================================
*/

function loadEvents() {

  const callbackName =
    "eventCallback_" +
    Date.now();


  window[callbackName] =
  function(response) {

    try {
      delete window[callbackName];
    }
    catch (e) {}


    if (
      !response ||
      !response.ok
    ) {

      showEventError(
        response &&
        response.message
          ? response.message
          : "Could not load events."
      );

      return;

    }


    events =
      response.events || [];


    populateEvents();

  };


  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=events" +

    "&callback=" +
    callbackName;


  script.onerror =
  function() {

    showEventError(
      "Could not contact attendance system."
    );

  };


  document.body.appendChild(script);

}


/*
====================================================
POPULATE EVENT DROPDOWN
====================================================
*/

function populateEvents() {

  const select =
    document.getElementById(
      "eventSelect"
    );


  select.innerHTML =
    '<option value="">' +
    'Choose an event...' +
    '</option>';


  if (
    events.length === 0
  ) {

    select.innerHTML =
      '<option value="">' +
      'No active events found' +
      '</option>';

    return;

  }


  events.forEach(
    function(event) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        event.id;


      let text =
        event.name;


      if (event.date) {

        text +=
          " — " +
          event.date;

      }


      option.textContent =
        text;


      select.appendChild(
        option
      );

    }
  );

}


/*
====================================================
SELECT EVENT
====================================================
*/

function chooseEvent() {

  const eventId =
    document.getElementById(
      "eventSelect"
    ).value;


  if (!eventId) {

    alert(
      "Please select an event."
    );

    return;

  }


  selectedEvent =
    events.find(
      function(event) {

        return (
          String(event.id) ===
          String(eventId)
        );

      }
    );


  if (!selectedEvent) {

    alert(
      "Event could not be found."
    );

    return;

  }


  document.getElementById(
    "eventSelection"
  ).style.display =
    "none";


  document.getElementById(
    "selectedEvent"
  ).style.display =
    "block";


  document.getElementById(
    "selectedEventName"
  ).textContent =
    selectedEvent.name;


  let details = [];


  if (
    selectedEvent.sport
  ) {

    details.push(
      selectedEvent.sport
    );

  }


  if (
    selectedEvent.date
  ) {

    details.push(
      selectedEvent.date
    );

  }


  if (
    selectedEvent.location
  ) {

    details.push(
      selectedEvent.location
    );

  }


  document.getElementById(
    "selectedEventDetails"
  ).textContent =
    details.join(" • ");

}


/*
====================================================
CHANGE EVENT
====================================================
*/

function changeEvent() {

  /*
   * We intentionally prevent event changes
   * while the camera is actively running.
   */

  if (scannerStarted) {

    alert(
      "Close or refresh the scanner page before changing events."
    );

    return;

  }


  selectedEvent =
    null;


  document.getElementById(
    "selectedEvent"
  ).style.display =
    "none";


  document.getElementById(
    "eventSelection"
  ).style.display =
    "block";

}


/*
====================================================
START SCANNER
====================================================
*/

function startScanner() {

  if (!selectedEvent) {

    alert(
      "Select an event first."
    );

    return;

  }


  if (scannerStarted) {
    return;
  }


  document.getElementById(
    "startButton"
  ).style.display =
    "none";


  document.getElementById(
    "statusBar"
  ).style.display =
    "block";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps: 12,

      qrbox: {

        width: 250,

        height: 250

      }

    },

    onScanSuccess,

    function(errorMessage) {

      /*
       * Normal unsuccessful QR
       * detection frames are ignored.
       */

    }

  )

  .then(
    function() {

      scannerStarted =
        true;


      processing =
        false;


      setStatus(
        "READY TO SCAN",
        "ready"
      );

    }
  )

  .catch(
    function(error) {

      showError(
        "CAMERA ERROR",
        error.message
      );


      document.getElementById(
        "startButton"
      ).style.display =
        "inline-block";

    }
  );

}


/*
====================================================
QR DETECTED
====================================================
*/

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  const code =
    String(
      decodedText
    ).trim();


  const now =
    Date.now();


  /*
   * Prevent the same visible QR
   * from repeatedly firing.
   */

  if (

    code === lastCode &&

    now - lastCodeTime <
      4000

  ) {

    return;

  }


  lastCode =
    code;


  lastCodeTime =
    now;


  processing =
    true;


  setStatus(
    "PROCESSING STUDENT...",
    ""
  );


  processStudent(
    code
  );

}


/*
====================================================
PROCESS STUDENT
====================================================
*/

function processStudent(
  studentId
) {

  const callbackName =
    "scanCallback_" +
    Date.now();


  window[callbackName] =
  function(response) {

    try {
      delete window[callbackName];
    }
    catch (e) {}


    showResult(
      response
    );

  };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    API_URL +

    "?action=scan" +

    "&studentId=" +
    encodeURIComponent(
      studentId
    ) +

    "&eventId=" +
    encodeURIComponent(
      selectedEvent.id
    ) +

    "&scanner=" +
    encodeURIComponent(
      "Main Gate"
    ) +

    "&callback=" +
    callbackName;


  script.onerror =
  function() {

    showError(

      "SYSTEM ERROR",

      "Could not contact attendance system."

    );


    unlockScanner();

  };


  document.body.appendChild(
    script
  );

}


/*
====================================================
DISPLAY SCAN RESULT
====================================================
*/

function showResult(r) {

  /*
   * SUCCESS
   */
  if (r.ok) {

    const result =
      document.getElementById("result");

    result.className =
      "success";

    result.innerHTML =

      '<div class="name">' +
      '✓ ' +
      escapeHtml(r.student || "STUDENT") +
      '</div>' +

      '<div class="big">' +
      'GRADE ' +
      escapeHtml(r.grade || "") +
      '</div>' +

      '<div class="big">' +
      'ATTENDANCE RECORDED' +
      '</div>' +

      '<div>' +
      escapeHtml(r.event || "") +
      '</div>' +

      '<div class="small">' +
      'Total Events Attended: <b>' +
      escapeHtml(r.total || "") +
      '</b>' +
      '</div>';

    /*
     * Put the student's name in the
     * large status bar too.
     */

    setStatus(
      "✓ " + (r.student || "ATTENDANCE RECORDED"),
      ""
    );

  }


  /*
   * DUPLICATE
   */
  else if (
    r.type === "DUPLICATE"
  ) {

    const result =
      document.getElementById("result");

    result.className =
      "warn";

    result.innerHTML =

      '<div class="name">' +
      '⚠ ALREADY CHECKED IN' +
      '</div>' +

      '<div class="big">' +
      escapeHtml(r.student || "") +
      '</div>' +

      '<div>' +
      escapeHtml(r.event || "") +
      '</div>';

    setStatus(
      "⚠ " + (r.student || "DUPLICATE"),
      ""
    );

  }


  /*
   * ERROR
   */
  else {

    showError(
      "✕ " +
      (
        r.message ||
        "UNKNOWN ERROR"
      ),
      ""
    );

    setStatus(
      "SCAN FAILED",
      ""
    );

  }


  /*
   * Unlock scanner after result
   */
  unlockScanner();

}

/*
====================================================
UNLOCK FOR NEXT STUDENT
====================================================
*/

function unlockScanner() {

  /*
   * Camera stays open.
   * We only temporarily lock QR processing.
   */

  setTimeout(

    function() {

      document.getElementById(
        "result"
      ).className =
        "";


      document.getElementById(
        "result"
      ).innerHTML =
        "";


      processing =
        false;


      setStatus(
        "READY TO SCAN",
        "ready"
      );

    },

    2000

  );

}


/*
====================================================
HELPERS
====================================================
*/

function showError(
  title,
  message
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "bad";


  result.innerHTML =

    '<div class="name">' +

    escapeHtml(title) +

    '</div>' +

    '<div class="big">' +

    escapeHtml(message) +

    '</div>';

}


function showEventError(
  message
) {

  const select =
    document.getElementById(
      "eventSelect"
    );


  select.innerHTML =

    '<option value="">' +

    escapeHtml(
      message
    ) +

    '</option>';

}


function setStatus(
  text,
  cssClass
) {

  document.getElementById(
    "statusBar"
  ).innerHTML =

    '<span class="' +

    cssClass +

    '">' +

    escapeHtml(text) +

    '</span>';

}


function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /[&<>"']/g,

      function(m) {

        return {

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'

        }[m];

      }
    );

}

</script>

</body>

</html>
