<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LCHS Student Athletic Pass</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

.subtitle {
  color: #f4c430;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
}

#statusBar {
  background: #222222;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
  font-weight: bold;
  font-size: 18px;
}

.ready {
  color: #f4c430;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 15px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  margin-top: 15px;
  padding: 20px;
  border-radius: 15px;
  min-height: 100px;
}

.success {
  background: #164d22;
}

.bad {
  background: #632020;
}

.warn {
  background: #66510d;
}

.name {
  font-size: 30px;
  font-weight: bold;
}

.big {
  font-size: 21px;
  margin: 8px;
}

.small {
  margin-top: 10px;
  font-size: 15px;
}

button {
  background: #f4c430;
  color: #111111;
  border: none;
  padding: 16px 30px;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>LEWIS COUNTY HIGH SCHOOL</h1>

<div class="subtitle">
STUDENT ATHLETIC PASS
</div>

<div id="statusBar">
  <span class="ready">PRESS START SCANNER</span>
</div>

<button id="startButton" onclick="startScanner()">
START SCANNER
</button>

<div id="reader"></div>

<div id="result"></div>

</div>


<script>

/*
====================================================
NEW GOOGLE APPS SCRIPT URL
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbxX4O8t7AmQhFzMNfxEG7n5YZnBEesD24-bka1PlqDTkVN2dCKJ-wuntxdObCpS4eLu/exec";


/*
====================================================
GLOBALS
====================================================
*/

let scanner = null;

let processing = false;

let scannerRunning = false;


/*
====================================================
START CAMERA ONCE
====================================================
*/

function startScanner() {

  document.getElementById("startButton")
    .style.display = "none";

  scanner = new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 12,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    function(errorMessage) {
      // Normal QR detection failures are ignored.
    }

  )

  .then(function() {

    scannerRunning = true;

    processing = false;

    setStatus("READY TO SCAN", "ready");

  })

  .catch(function(error) {

    console.error(error);

    showError(
      "CAMERA ERROR",
      error.message
    );

    document.getElementById("startButton")
      .style.display = "inline-block";

    setStatus("SCANNER STOPPED", "");

  });

}


/*
====================================================
QR DETECTED
====================================================
*/

function onScanSuccess(decodedText) {

  /*
   * Ignore additional QR detections while
   * one student is being processed.
   */

  if (processing) {
    return;
  }

  processing = true;

  setStatus(
    "PROCESSING STUDENT...",
    ""
  );


  /*
   * IMPORTANT:
   *
   * Pause QR detection.
   * DO NOT stop the camera.
   */

  try {

    scanner.pause(true);

  }

  catch (e) {

    console.log(
      "Pause warning:",
      e
    );

  }


  processStudent(decodedText);

}


/*
====================================================
SEND STUDENT TO GOOGLE
====================================================
*/

function processStudent(studentId) {

  showMessage(
    "CHECKING STUDENT..."
  );


  const callbackName =
    "lchsCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showResult(result);

    };


  const script =
    document.createElement("script");


  script.src =

    API_URL +

    "?action=scan" +

    "&studentId=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +

    "&scanner=" +
    encodeURIComponent(
      "Main Gate"
    ) +

    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showError(

        "SYSTEM ERROR",

        "Could not contact attendance system."

      );


      resumeAfterDelay();

    };


  document.body.appendChild(script);

}


/*
====================================================
SHOW RESULT
====================================================
*/

function showResult(r) {


  /*
   * SUCCESSFUL CHECK-IN
   */

  if (r.ok) {

    const result =
      document.getElementById("result");


    result.className =
      "success";


    result.innerHTML =

      '<div class="name">' +

      '✓ ' +

      escapeHtml(r.student) +

      '</div>' +

      '<div class="big">' +

      'GRADE ' +

      escapeHtml(r.grade) +

      '</div>' +

      '<div class="big">' +

      'ATTENDANCE RECORDED' +

      '</div>' +

      '<div>' +

      escapeHtml(r.event) +

      '</div>' +

      '<div class="small">' +

      'Total Events Attended: <b>' +

      escapeHtml(r.total) +

      '</b>' +

      '</div>';


    setStatus(
      "✓ SUCCESS",
      ""
    );

  }


  /*
   * DUPLICATE
   */

  else if (
    r.type === "DUPLICATE"
  ) {

    const result =
      document.getElementById("result");


    result.className =
      "warn";


    result.innerHTML =

      '<div class="name">' +

      '⚠ ALREADY CHECKED IN' +

      '</div>' +

      '<div class="big">' +

      escapeHtml(r.student) +

      '</div>' +

      '<div>' +

      escapeHtml(r.event || "") +

      '</div>';


    setStatus(
      "DUPLICATE",
      ""
    );

  }


  /*
   * OTHER ERROR
   */

  else {

    showError(

      "✕ " +
      (
        r.message ||
        "UNKNOWN ERROR"
      ),

      ""

    );


    setStatus(
      "SCAN FAILED",
      ""
    );

  }


  resumeAfterDelay();

}


/*
====================================================
RESUME SAME CAMERA
====================================================
*/

function resumeAfterDelay() {

  /*
   * Show the result for 2 seconds.
   */

  setTimeout(

    function() {

      document.getElementById("result")
        .className = "";


      document.getElementById("result")
        .innerHTML = "";


      /*
       * Resume QR detection without
       * closing/reopening the camera.
       */

      try {

        scanner.resume();

        processing = false;

        setStatus(
          "READY TO SCAN",
          "ready"
        );

      }

      catch (error) {

        console.error(
          "Resume error:",
          error
        );


        /*
         * Only show restart button if something
         * actually went wrong with the camera.
         */

        processing = false;

        scannerRunning = false;


        showError(
          "SCANNER ERROR",
          "Tap START SCANNER to restart."
        );


        document.getElementById("startButton")
          .style.display =
          "inline-block";

      }

    },

    2000
  );

}


/*
====================================================
HELPERS
====================================================
*/

function showMessage(message) {

  const result =
    document.getElementById("result");


  result.className = "";


  result.innerHTML =

    '<div class="big">' +

    escapeHtml(message) +

    '</div>';

}


function showError(
  title,
  message
) {

  const result =
    document.getElementById("result");


  result.className =
    "bad";


  result.innerHTML =

    '<div class="name">' +

    escapeHtml(title) +

    '</div>' +

    '<div class="big">' +

    escapeHtml(message) +

    '</div>';

}


function setStatus(
  text,
  cssClass
) {

  document.getElementById(
    "statusBar"
  ).innerHTML =

    '<span class="' +

    cssClass +

    '">' +

    escapeHtml(text) +

    '</span>';

}


function escapeHtml(text) {

  return String(text)
    .replace(
      /[&<>"']/g,

      function(m) {

        return {

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'

        }[m];

      }
    );

}

</script>

</body>

</html>
