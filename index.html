<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>LCHS Athletic Pass Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

.gold {
  color: #f4c430;
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

#result {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  min-height: 80px;
}

.success {
  background: #164d22;
}

.bad {
  background: #632020;
}

.warn {
  background: #66510d;
}

.name {
  font-size: 28px;
  font-weight: bold;
}

.big {
  font-size: 20px;
  margin: 8px;
}

.instructions {
  color: #cccccc;
  font-size: 15px;
  margin-top: 15px;
}

button {
  background: #f4c430;
  color: #111111;
  border: none;
  padding: 16px 30px;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
  margin: 10px;
}

button:active {
  transform: scale(0.97);
}

</style>

</head>


<body>

<div class="container">

<h1>
LEWIS COUNTY HIGH SCHOOL
</h1>

<div class="gold">
STUDENT ATHLETIC PASS
</div>


<button
  id="startButton"
  onclick="startScanner()">

START SCANNER

</button>


<div id="reader"></div>


<div class="instructions">

Point the camera at the QR code
on the back of the student's ID.

</div>


<div id="result"></div>

</div>


<script>


/*
====================================================
APPS SCRIPT API
====================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzFih6G6E6XcMCtzWFHr402OdeCOUsXfQIoZJCeT_98F1DXB2-25Ut0fE5iTnZqh9kCIw/exec";


/*
====================================================
GLOBAL VARIABLES
====================================================
*/

let scanner = null;

let scanning = false;


/*
====================================================
START CAMERA / QR SCANNER
====================================================
*/

function startScanner() {

  const button =
    document.getElementById("startButton");

  button.style.display = "none";


  document.getElementById("result")
    .innerHTML = "";


  scanner =
    new Html5Qrcode("reader");


  scanning = true;


  scanner.start(

    {
      facingMode: "environment"
    },


    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },


    function(decodedText) {

      if (!scanning) {
        return;
      }


      scanning = false;


      scanner.stop()

        .then(function() {

          processStudent(decodedText);

        })

        .catch(function() {

          processStudent(decodedText);

        });

    },


    function(errorMessage) {

      /*
       * Normal QR scanning errors are ignored.
       */

    }

  )


  .catch(function(error) {

    console.error(error);


    showError(
      "CAMERA ERROR",
      error.message
    );


    button.style.display =
      "inline-block";

  });

}


/*
====================================================
SEND STUDENT ID TO GOOGLE APPS SCRIPT
====================================================
*/

function processStudent(studentId) {

  showMessage(
    "CHECKING STUDENT..."
  );


  /*
   * Create a unique JSONP callback.
   */

  const callbackName =
    "lchsCallback_" +
    Date.now();


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      /*
       * Remove callback after use.
       */

      try {
        delete window[callbackName];
      }

      catch (e) {}


      /*
       * Display result.
       */

      showResult(result);

    };


  /*
   * Create script element.
   */

  const script =
    document.createElement("script");


  /*
   * Build API request.
   */

  script.src =

    API_URL +

    "?action=scan" +

    "&studentId=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +

    "&scanner=" +
    encodeURIComponent(
      "Main Gate"
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  /*
   * Handle communication failure.
   */

  script.onerror =
    function() {

      try {
        delete window[callbackName];
      }

      catch (e) {}


      showError(

        "SYSTEM ERROR",

        "Could not contact attendance system."

      );

    };


  /*
   * Add request to page.
   */

  document.body.appendChild(script);

}


/*
====================================================
SHOW SUCCESS / ERROR / DUPLICATE
====================================================
*/

function showResult(r) {


  /*
   * SUCCESS
   */

  if (r.ok) {

    const result =
      document.getElementById("result");


    result.className =
      "success";


    result.innerHTML =

      '<div class="name">' +

      '✓ ' +

      escapeHtml(
        r.student
      ) +

      '</div>' +


      '<div class="big">' +

      'GRADE ' +

      escapeHtml(
        r.grade
      ) +

      '</div>' +


      '<div class="big">' +

      'ATTENDANCE RECORDED' +

      '</div>' +


      '<div>' +

      escapeHtml(
        r.event
      ) +

      '</div>' +


      '<div style="margin-top:10px">' +

      'Total Athletic Events: ' +

      '<b>' +

      escapeHtml(
        r.total
      ) +

      '</b>' +

      '</div>';

  }


  /*
   * DUPLICATE
   */

  else if (
    r.type === "DUPLICATE"
  ) {

    const result =
      document.getElementById("result");


    result.className =
      "warn";


    result.innerHTML =

      '<div class="name">' +

      '⚠ ALREADY CHECKED IN' +

      '</div>' +


      '<div class="big">' +

      escapeHtml(
        r.student
      ) +

      '</div>';

  }


  /*
   * OTHER ERROR
   */

  else {

    showError(

      "✕ " +
      (
        r.message ||
        "UNKNOWN ERROR"
      ),

      ""

    );

  }


  /*
   * Reset after 2.5 seconds.
   */

  setTimeout(
    resetScanner,
    2500
  );

}


/*
====================================================
SHOW MESSAGE
====================================================
*/

function showMessage(message) {

  const result =
    document.getElementById("result");


  result.className =
    "";


  result.innerHTML =

    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


/*
====================================================
SHOW ERROR
====================================================
*/

function showError(
  title,
  message
) {

  const result =
    document.getElementById("result");


  result.className =
    "bad";


  result.innerHTML =

    '<div class="name">' +

    escapeHtml(
      title
    ) +

    '</div>' +


    '<div class="big">' +

    escapeHtml(
      message
    ) +

    '</div>';

}


/*
====================================================
RESET SCANNER
====================================================
*/

function resetScanner() {


  const result =
    document.getElementById("result");


  result.className =
    "";


  result.innerHTML =
    "";


  const reader =
    document.getElementById("reader");


  reader.innerHTML =
    "";


  const button =
    document.getElementById("startButton");


  button.style.display =
    "inline-block";


  scanner =
    null;


  scanning =
    false;

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(text) {

  return String(text)

    .replace(
      /[&<>"']/g,

      function(m) {

        return {

          '&': '&amp;',

          '<': '&lt;',

          '>': '&gt;',

          '"': '&quot;',

          "'": '&#039;'

        }[m];

      }

    );

}

</script>

</body>

</html>
